<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AIRA JARVIS</title>
<style>
:root{--cyan:#3de8ff;--cyan2:#18b6ff;--violet:#5b8cff;--ink:#e8f4ff;--mute:#8da4bd;--bg0:#02030a;--bg1:#050a1c;--bg2:#081a45}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden;background:var(--bg0)}
body{font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;font-weight:200;color:var(--ink);
  background:radial-gradient(120% 90% at 55% 40%,var(--bg2) 0%,var(--bg1) 45%,var(--bg0) 100%);
  opacity:0;transition:opacity 1.4s ease;-webkit-font-smoothing:antialiased;user-select:none}
body.ready{opacity:1}
#app{position:relative;width:100vw;height:100vh;overflow:hidden}
#bg{position:absolute;inset:0;width:100%;height:100%;display:block}
.vig{position:absolute;inset:0;pointer-events:none;background:
  radial-gradient(60% 75% at 20% 12%,rgba(40,90,230,.18),transparent 70%),
  radial-gradient(55% 70% at 88% 60%,rgba(0,150,255,.12),transparent 70%),
  radial-gradient(130% 100% at 50% 50%,transparent 55%,rgba(0,0,6,.7) 100%)}

/* portrait */
#plate{position:absolute;top:0;height:100vh;pointer-events:none;opacity:0;transition:opacity 1.8s ease}
#rings{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}

/* HUD readout */
.hud{position:absolute;right:3.6vw;top:25vh;width:clamp(150px,13.5vw,240px);padding:14px 16px 12px;z-index:3;pointer-events:none;opacity:0;animation:fadeIn 1.6s 1.6s ease forwards;
  background:linear-gradient(160deg,rgba(20,60,140,.22),rgba(4,14,40,.35));border:1px solid rgba(90,170,255,.16);
  -webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);
  clip-path:polygon(0 0,calc(100% - 14px) 0,100% 14px,100% 100%,14px 100%,0 calc(100% - 14px))}
.hud::before,.hud::after{content:"";position:absolute;width:12px;height:12px;border:1px solid rgba(90,200,255,.55)}
.hud::before{left:0;top:0;border-right:0;border-bottom:0}.hud::after{right:0;bottom:0;border-left:0;border-top:0}
.hud-t{display:flex;align-items:center;gap:8px;font-size:clamp(8px,.6vw,10px);letter-spacing:.34em;color:#7fb4e6;font-weight:300;margin-bottom:12px}
.hud-t i{width:5px;height:5px;border-radius:50%;background:var(--cyan2);box-shadow:0 0 8px var(--cyan2)}
.hud ul{list-style:none;display:grid;gap:9px;margin-bottom:12px}
.hud li{display:flex;align-items:center;gap:10px;font-size:clamp(9px,.74vw,13px);letter-spacing:.22em;font-weight:300;color:#5f7da0;transition:color .4s,text-shadow .4s}
.hud li b{width:6px;height:6px;border:1px solid currentColor;border-radius:50%;transition:background .4s,box-shadow .4s}
.hud li.on{color:#bff3ff;text-shadow:0 0 12px rgba(61,232,255,.7)}
.hud li.on b{background:var(--cyan);box-shadow:0 0 10px var(--cyan)}
#mini{display:block;width:100%;height:30px}

/* top bar */
header{position:absolute;top:0;left:0;right:0;height:11vh;min-height:64px;display:flex;align-items:center;justify-content:space-between;padding:0 4.6vw;z-index:5}
.mark{font-size:clamp(12px,.95vw,17px);font-weight:200;letter-spacing:.5em;color:#d3e4f5;text-transform:uppercase;opacity:0;animation:fadeIn 1.4s .6s ease forwards}
nav{display:flex;gap:clamp(10px,1.1vw,20px);opacity:0;animation:fadeIn 1.4s .8s ease forwards}
nav button{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;cursor:pointer;color:#9fe4f6;
  background:rgba(120,190,255,.06);border:1px solid rgba(120,200,255,.14);
  -webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);transition:transform .35s ease,color .35s,box-shadow .35s,border-color .35s}
nav button:hover,nav button:focus-visible{transform:scale(1.12);color:var(--cyan);border-color:rgba(61,232,255,.55);box-shadow:0 0 18px rgba(61,232,255,.35),inset 0 0 10px rgba(61,232,255,.12);outline:none}
nav svg{width:19px;height:19px;fill:none;stroke:currentColor;stroke-width:1;stroke-linecap:round;stroke-linejoin:round}

/* hero text */
.hero{position:absolute;left:5.2vw;top:47%;transform:translateY(-58%);z-index:4;max-width:32vw}
.eyebrow{display:flex;align-items:center;gap:1.1vw;font-size:clamp(10px,.78vw,14px);letter-spacing:.42em;color:#9fd6ea;font-weight:300;text-transform:uppercase;white-space:nowrap}
.eyebrow i{display:block;height:1px;width:clamp(36px,3.6vw,70px);background:linear-gradient(90deg,var(--cyan),rgba(61,232,255,0));box-shadow:0 0 8px rgba(61,232,255,.7)}
h1{margin:2.2vh 0 2.2vh -.04em;font-weight:100;font-size:clamp(52px,5.1vw,104px);line-height:1;letter-spacing:.05em;color:#f1f8ff;white-space:nowrap;text-shadow:0 0 40px rgba(80,170,255,.18)}
.sub{font-size:clamp(13px,1.08vw,20px);letter-spacing:.09em;color:#a9bfd6;font-weight:300}
.hero>*{opacity:0;transform:translateY(14px);animation:rise 1.4s cubic-bezier(.2,.7,.2,1) forwards}
.hero .eyebrow{animation-delay:.9s}.hero h1{animation-delay:1.25s}.hero .sub{animation-delay:1.7s}

/* voice */
.voice{position:absolute;left:50%;bottom:4.6vh;transform:translateX(-50%);z-index:5;display:flex;flex-direction:column;align-items:center;gap:1.1vh;opacity:0;animation:fadeIn 1.6s 1.9s ease forwards}
#status{font-size:clamp(10px,.75vw,13px);letter-spacing:.5em;padding-left:.5em;color:#8fdcf0;font-weight:300;height:1.4em;transition:opacity .25s ease,color .4s;text-shadow:0 0 10px rgba(61,232,255,.5)}
.row{position:relative;width:min(760px,60vw);height:76px}
#wave{position:absolute;inset:0;width:100%;height:100%}
#mic{position:absolute;left:50%;top:50%;width:62px;height:62px;margin:-31px 0 0 -31px;border-radius:50%;cursor:pointer;display:grid;place-items:center;color:var(--cyan);
  background:radial-gradient(circle at 50% 35%,rgba(61,232,255,.22),rgba(30,60,140,.18) 70%);border:1px solid rgba(61,232,255,.5);
  -webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);
  box-shadow:0 0 calc(14px + 26px*var(--g,0)) rgba(61,232,255,calc(.28 + .5*var(--g,0))),inset 0 0 14px rgba(61,232,255,.2);
  transition:transform .35s ease;animation:micPulse 3.6s ease-in-out infinite}
#mic:hover{transform:scale(1.07)}#mic:active{transform:scale(.96)}
#mic:focus-visible{outline:1px solid var(--cyan);outline-offset:4px}
#mic svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.1;stroke-linecap:round;stroke-linejoin:round}
@keyframes micPulse{50%{border-color:rgba(61,232,255,.75)}}
@keyframes fadeIn{to{opacity:1}}
@keyframes rise{to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){#mic{animation:none}.hero>*{animation-duration:.01s;transform:none}}

/* Holographic Settings Modal */
.modal-overlay{position:fixed;inset:0;background:rgba(2,5,15,.75);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);z-index:100;display:flex;align-items:center;justify-content:center;opacity:0;pointer-events:none;transition:opacity .35s ease}
.modal-overlay.open{opacity:1;pointer-events:auto}
.modal-box{width:min(520px,90vw);background:linear-gradient(165deg,rgba(8,26,69,.88),rgba(4,14,40,.96));border:1px solid rgba(61,232,255,.4);box-shadow:0 0 35px rgba(24,182,255,.25),inset 0 0 20px rgba(61,232,255,.08);padding:24px 28px;clip-path:polygon(0 0,calc(100% - 16px) 0,100% 16px,100% 100%,16px 100%,0 calc(100% - 16px));color:var(--ink)}
.modal-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;border-bottom:1px solid rgba(90,170,255,.2);padding-bottom:12px}
.modal-title{font-size:clamp(11px,.8vw,14px);letter-spacing:.3em;color:var(--cyan);font-weight:300}
.modal-title span{color:#9fe4f6;opacity:.7}
.modal-close{background:none;border:none;color:#8da4bd;font-size:22px;cursor:pointer;line-height:1;transition:color .25s,transform .25s}
.modal-close:hover{color:var(--cyan);transform:scale(1.15)}
.cfg-group{margin-bottom:16px}
.cfg-group label{display:block;font-size:10px;letter-spacing:.25em;color:#7fb4e6;margin-bottom:6px;font-weight:300}
.cfg-group small{display:block;font-size:10px;color:#6b87a8;margin-top:4px}
.cfg-group small a{color:var(--cyan);text-decoration:none}
.cfg-group small a:hover{text-decoration:underline}
.cfg-input-row{display:flex;gap:8px}
.cfg-group input,.cfg-group select{width:100%;background:rgba(12,30,70,.6);border:1px solid rgba(90,170,255,.28);color:#d3e4f5;padding:8px 12px;font-size:12px;letter-spacing:.05em;border-radius:2px;outline:none;transition:border-color .3s,box-shadow .3s}
.cfg-group input:focus,.cfg-group select:focus{border-color:var(--cyan);box-shadow:0 0 10px rgba(61,232,255,.3)}
.cfg-input-row button{background:rgba(61,232,255,.12);border:1px solid rgba(61,232,255,.35);color:var(--cyan);padding:0 14px;cursor:pointer;font-size:10px;letter-spacing:.15em;border-radius:2px;transition:background .25s}
.cfg-input-row button:hover{background:rgba(61,232,255,.25)}
.cfg-status-box{display:flex;align-items:center;gap:10px;padding:10px 14px;background:rgba(10,25,60,.4);border:1px solid rgba(61,232,255,.18);font-size:11px;letter-spacing:.15em;margin:18px 0;color:#9fe4f6}
.cfg-status-box .dot{width:7px;height:7px;border-radius:50%;background:#48bb78;box-shadow:0 0 8px #48bb78}
.cfg-status-box .dot.off{background:#ed8936;box-shadow:0 0 8px #ed8936}
.modal-footer{display:flex;justify-content:flex-end;gap:12px;margin-top:20px;border-top:1px solid rgba(90,170,255,.2);padding-top:16px}
.cfg-btn{padding:8px 18px;font-size:11px;letter-spacing:.2em;cursor:pointer;border-radius:2px;transition:all .3s ease;text-transform:uppercase}
.cfg-btn-test{background:transparent;border:1px solid rgba(90,170,255,.3);color:#8da4bd}
.cfg-btn-test:hover{color:var(--cyan);border-color:var(--cyan)}
.cfg-btn-save{background:rgba(61,232,255,.18);border:1px solid var(--cyan);color:#fff;box-shadow:0 0 12px rgba(61,232,255,.3)}
.cfg-btn-save:hover{background:rgba(61,232,255,.35);box-shadow:0 0 18px rgba(61,232,255,.5)}
#voice-dialogue{font-size:clamp(11px,.82vw,14px);color:#9fd6ea;max-width:min(600px,75vw);text-align:center;min-height:1.4em;opacity:.88;letter-spacing:.06em;margin-bottom:6px;transition:opacity .3s;text-shadow:0 0 12px rgba(61,232,255,.45);pointer-events:none}
.voice-input-bar{display:flex;align-items:center;gap:8px;width:min(440px,84vw);background:rgba(10,25,48,.65);border:1px solid rgba(61,232,255,.4);border-radius:28px;padding:5px 8px 5px 16px;box-shadow:0 0 18px rgba(61,232,255,.15);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);margin-bottom:8px;transition:border-color .3s,box-shadow .3s}
.voice-input-bar:focus-within{border-color:var(--cyan);box-shadow:0 0 22px rgba(61,232,255,.38)}
.voice-input-bar input{flex:1;background:transparent;border:none;outline:none;color:#e2f7ff;font-family:inherit;font-size:clamp(11px,.82vw,13px);letter-spacing:.04em}
.voice-input-bar input::placeholder{color:rgba(140,210,240,.45)}
.voice-input-bar button{width:28px;height:28px;border-radius:50%;border:none;background:radial-gradient(circle at 40% 35%,rgba(61,232,255,.8),rgba(30,100,200,.8));cursor:pointer;display:grid;place-items:center;color:#fff;transition:transform .2s,box-shadow .2s;flex-shrink:0}
.voice-input-bar button:hover{transform:scale(1.1);box-shadow:0 0 14px rgba(61,232,255,.7)}
.voice-input-bar button svg{width:13px;height:13px;fill:currentColor}

</style>
</head>
<body>
<div id="app">
  <canvas id="bg"></canvas>
  <div class="vig"></div>
  <canvas id="plate"></canvas><canvas id="rings"></canvas>
  <aside class="hud" id="hud" aria-hidden="true">
    <div class="hud-t"><i></i>VOICE INTERFACE</div>
    <ul>
      <li data-s="listening"><b></b>LISTENING..</li>
      <li data-s="thinking"><b></b>PROCESSING..</li>
      <li data-s="speaking"><b></b>RESPONDING..</li>
    </ul>
    <canvas id="mini"></canvas>
  </aside>

  <header>
    <div class="mark">AIRA JARVIS</div>
    <nav aria-label="Controls">
      <button aria-label="Settings" title="Settings" id="settings-btn"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg></button>
      <button aria-label="System status" title="System status"><svg viewBox="0 0 24 24"><path d="M2 12h4l2.5-7 4 14 3-9 1.5 2H22"/></svg></button>
      <button aria-label="Applications" title="Applications"><svg viewBox="0 0 24 24"><rect x="4" y="4" width="6" height="6" rx="1.2"/><rect x="14" y="4" width="6" height="6" rx="1.2"/><rect x="4" y="14" width="6" height="6" rx="1.2"/><rect x="14" y="14" width="6" height="6" rx="1.2"/></svg></button>
      <button aria-label="Profile" title="Profile"><svg viewBox="0 0 24 24"><circle cx="12" cy="8.5" r="3.8"/><path d="M4.5 20.5c.8-4 3.8-6.2 7.5-6.2s6.7 2.2 7.5 6.2"/></svg></button>
    </nav>
  </header>

  <section class="hero">
    <div class="eyebrow">Good evening<i></i></div>
    <h1>I'M AIRA.</h1>
    <p class="sub">Your intelligent personal assistant.</p>
  </section>

  <div class="voice">
    <div id="status" aria-live="polite">IDLE</div>
    <div id="voice-dialogue"></div>
    <div class="voice-input-bar">
      <input type="text" id="voice-text-input" placeholder="Type a message or click the mic below..." autocomplete="off" />
      <button id="voice-send-btn" aria-label="Send" title="Send message"><svg viewBox="0 0 24 24"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg></button>
    </div>
    <div class="row">
      <canvas id="wave"></canvas>
      <button id="mic" aria-label="Microphone"><svg viewBox="0 0 24 24"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5.5 11.5a6.5 6.5 0 0 0 13 0M12 18v3"/></svg></button>
    </div>
  </div>
</div>

<!-- Holographic Settings Modal -->
<div id="settings-modal" class="modal-overlay">
  <div class="modal-box">
    <div class="modal-header">
      <div class="modal-title"><span>AIRA JARVIS</span> // HUGGING FACE AI CONFIG</div>
      <button class="modal-close" id="settings-close" aria-label="Close settings">&times;</button>
    </div>
    <div class="modal-body">
      <div class="cfg-group">
        <label>HUGGING FACE API TOKEN</label>
        <div class="cfg-input-row">
          <input type="password" id="hf-token-input" placeholder="hf_xxxxxxxxxxxxxxxxxxxxxx" autocomplete="off" />
          <button id="hf-token-toggle" type="button">SHOW</button>
        </div>
        <small>Free user access token from <a href="https://huggingface.co/settings/tokens" target="_blank" rel="noreferrer">huggingface.co/settings/tokens</a></small>
      </div>
      <div class="cfg-group">
        <label>SPEECH-TO-TEXT MODEL (WHISPER STT)</label>
        <select id="hf-stt-select">
          <option value="openai/whisper-large-v3-turbo">openai/whisper-large-v3-turbo (Accurate & Fast)</option>
          <option value="openai/whisper-small">openai/whisper-small (Lightweight)</option>
          <option value="openai/whisper-base">openai/whisper-base (Compact)</option>
        </select>
      </div>
      <div class="cfg-group">
        <label>AI REASONING MODEL (LLM)</label>
        <select id="hf-llm-select">
          <option value="meta-llama/Llama-3.1-8B-Instruct">meta-llama/Llama-3.1-8B-Instruct (Recommended)</option>
          <option value="Qwen/Qwen2.5-72B-Instruct">Qwen/Qwen2.5-72B-Instruct (High Intelligence)</option>
          <option value="deepseek-ai/DeepSeek-V3">deepseek-ai/DeepSeek-V3</option>
          <option value="google/gemma-2-9b-it">google/gemma-2-9b-it</option>
        </select>
      </div>
      <div class="cfg-group">
        <label>TEXT-TO-SPEECH MODEL (VOICE TTS)</label>
        <select id="hf-tts-select">
          <option value="facebook/mms-tts-eng">facebook/mms-tts-eng (Recommended MMS)</option>
          <option value="espnet/kan-bayashi_ljspeech_vits">espnet/kan-bayashi_ljspeech_vits</option>
        </select>
      </div>
      <div class="cfg-status-box" id="hf-status-box">
        <span class="dot" id="hf-dot"></span>
        <span id="hf-status-text">Ready (Web Speech fallback active)</span>
      </div>
    </div>
    <div class="modal-footer">
      <button class="cfg-btn cfg-btn-test" id="cfg-test-btn" type="button">Test Voice</button>
      <button class="cfg-btn cfg-btn-save" id="cfg-save-btn" type="button">Save & Apply</button>
    </div>
  </div>
</div>

<script>

(()=>{
'use strict';

// Auto-redirect to local server when opened via file:/// for secure context & optimal audio access
if (window.location.protocol === 'file:') {
  fetch('http://127.0.0.1:8000/api/status', { mode: 'cors' })
    .then(r => { if (r.ok) window.location.href = 'http://localhost:8000'; })
    .catch(() => {});
}
const RM = matchMedia('(prefers-reduced-motion: reduce)').matches;
const $ = id=>document.getElementById(id);
const rnd=(a,b)=>a+Math.random()*(b-a);
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const lerp=(a,b,t)=>a+(b-a)*t;
const ease=t=>t*t*(3-2*t);
// frame-rate independent smoothing
const sm=(cur,tgt,rate,dt)=>cur+(tgt-cur)*(1-Math.exp(-rate*dt));

const STATES=['idle','listening','thinking','speaking'];
const LABEL={idle:'IDLE',listening:'LISTENING',thinking:'THINKING',speaking:'SPEAKING'};
let state='idle';const L={listen:0,think:0,speak:0};const statusEl=$('status'),micBtn=$('mic');
let analyser=null,freqData=null,mouthOpen=0,kick=0;
let W=0,H=0,DPR=1;const mouse={x:0,y:0,sx:0,sy:0};const ANCHOR=0.655;
function mkNoise(base){const f=[base*rnd(.8,1.2),base*rnd(1.9,2.6),base*rnd(4.2,5.6)],p=[rnd(0,6.3),rnd(0,6.3),rnd(0,6.3)];return t=>(Math.sin(t*f[0]+p[0])+.6*Math.sin(t*f[1]+p[1])+.35*Math.sin(t*f[2]+p[2]))/1.95}
/* ---------- background canvas ---------- */
const bg=$('bg'), bctx=bg.getContext('2d');
const wave=$('wave'), wctx=wave.getContext('2d');
function sprite(rgb,size){
  const c=document.createElement('canvas');c.width=c.height=size;const x=c.getContext('2d');
  const g=x.createRadialGradient(size/2,size/2,0,size/2,size/2,size/2);
  g.addColorStop(0,`rgba(${rgb},1)`);g.addColorStop(.18,`rgba(${rgb},.55)`);g.addColorStop(1,`rgba(${rgb},0)`);
  x.fillStyle=g;x.fillRect(0,0,size,size);return c;
}
const spC=sprite('90,220,255',64), spV=sprite('110,150,255',64), spB=sprite('60,140,255',64);
let P=[],D=[],TR=[];
function initParticles(){
  const n=Math.round(clamp(W*H/22000,50,110));
  P=[];for(let i=0;i<n;i++)P.push({x:rnd(0,W),y:rnd(0,H),vx:rnd(-.12,.12),vy:rnd(-.1,.08),z:rnd(.25,1),r:rnd(.9,2.4),ph:rnd(0,6.3),s:Math.random()<.2?spV:(Math.random()<.5?spB:spC),b:0});
  TR=[];
  for(let i=0;i<12;i++){
    const right=i%2===1,dir=right?-1:1;let x=right?W:0,y=H*(.1+.8*((i*.37)%1));const pts=[[x,y]];
    const segs=3+(i%3);for(let k=0;k<segs;k++){const run=W*rnd(.025,.07);x+=dir*run;pts.push([x,y]);const jog=H*rnd(.03,.09)*(Math.random()<.5?-1:1);y=clamp(y+jog,H*.06,H*.94);x+=dir*Math.abs(jog)*.6;pts.push([x,y])}
    let len=0;const cum=[0];for(let k=1;k<pts.length;k++){len+=Math.hypot(pts[k][0]-pts[k-1][0],pts[k][1]-pts[k-1][1]);cum.push(len)}
    TR.push({pts,cum,len,sp:rnd(.04,.09),ph:rnd(0,1)});
  }

  ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  g=ctx.createRadialGradient(W*.12,H*.08,0,W*.12,H*.08,H*.7);
  g.addColorStop(0,'rgba(50,100,240,.12)');g.addColorStop(1,'rgba(0,0,0,0)');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);

  for(const o of rings){

    rc.strokeStyle=`rgba(90,210,255,${o.a*(1+act*.9)})`;rc.beginPath();rc.arc(0,0,o.r,0,6.2832);rc.stroke();rc.restore();
  }
  // tick ring
  rc.save();rc.rotate(-t*.03);rc.setLineDash([]);rc.strokeStyle=`rgba(120,200,255,${.12+act*.1})`;rc.lineWidth=1;rc.beginPath();
  const tr=R*1.05;for(let i=0;i<120;i++){const a=i/120*6.2832,l=i%10===0?9:4;rc.moveTo(Math.cos(a)*tr,Math.sin(a)*tr);rc.lineTo(Math.cos(a)*(tr+l),Math.sin(a)*(tr+l))}rc.stroke();rc.restore();
  // arc segments, violet
  rc.save();rc.rotate(t*.045);rc.setLineDash([]);rc.lineWidth=1.4;rc.strokeStyle='rgba(90,140,255,.22)';
  for(let i=0;i<3;i++){rc.beginPath();rc.arc(0,0,R*.88,i*2.09,i*2.09+.7);rc.stroke()}
  rc.strokeStyle='rgba(61,232,255,.22)';rc.rotate(-t*.09);
  for(let i=0;i<2;i++){rc.beginPath();rc.arc(0,0,R*1.22,i*3.14+.3,i*3.14+.9);rc.stroke()}
  rc.restore();rc.restore();

  rc.globalCompositeOperation="source-over";
// energy lines
  ctx.lineWidth=1;
  for(let k=0;k<3;k++){
    const base=H*(.28+k*.22), amp=H*(.05+k*.018), sp=.22+k*.1;
    const lg=ctx.createLinearGradient(0,0,W,0);
    lg.addColorStop(0,'rgba(61,232,255,0)');lg.addColorStop(.3,`rgba(61,232,255,${.07+act*.04})`);lg.addColorStop(.6,`rgba(80,140,255,${.07+act*.04})`);lg.addColorStop(1,'rgba(61,232,255,0)');
    ctx.strokeStyle=lg;ctx.beginPath();

    ctx.stroke();
  }

  // circuit traces

  for(const tr of TR){
    ctx.strokeStyle=`rgba(70,150,255,${.12+act*.05})`;ctx.beginPath();tr.pts.forEach((q,i)=>i?ctx.lineTo(q[0],q[1]):ctx.moveTo(q[0],q[1]));ctx.stroke();

    const px=lerp(a[0],b[0],f),py=lerp(a[1],b[1],f);ctx.globalAlpha=.8;ctx.drawImage(spC,px-8,py-8,16,16);ctx.globalAlpha=1;
  }

    ctx.save();ctx.translate(gx2,gy2);ctx.lineCap='round';
    ctx.strokeStyle=`rgba(80,190,255,${.22+act*.15})`;ctx.lineWidth=1;ctx.beginPath();ctx.arc(0,0,r,0,6.2832);ctx.stroke();
    ctx.strokeStyle=`rgba(61,232,255,${.3+act*.25})`;ctx.lineWidth=2.4;
    ctx.save();ctx.rotate(t*sp+seed);ctx.beginPath();ctx.arc(0,0,r*.82,0,1.9);ctx.stroke();ctx.beginPath();ctx.arc(0,0,r*.82,3.3,4.2);ctx.stroke();ctx.restore();
    ctx.strokeStyle='rgba(90,150,255,.28)';ctx.lineWidth=1;ctx.save();ctx.rotate(-t*sp*.6);ctx.setLineDash([2,6]);ctx.beginPath();ctx.arc(0,0,r*.62,0,6.2832);ctx.stroke();ctx.restore();
    ctx.beginPath();for(let i=0;i<48;i++){const a=i/48*6.2832,l=i%6===0?7:3.5;ctx.moveTo(Math.cos(a)*(r*1.1),Math.sin(a)*(r*1.1));ctx.lineTo(Math.cos(a)*(r*1.1+l),Math.sin(a)*(r*1.1+l))}ctx.stroke();
    ctx.globalAlpha=.5+.4*Math.sin(t*1.6+seed);ctx.drawImage(spC,-14,-14,28,28);ctx.globalAlpha=1;
    ctx.restore();
  };
  const gR=Math.max(34,H*.075);

  // thinking pulses
  if(L.think>.05&&t>nextPulse){pulses.push({r:0,a:1});nextPulse=t+rnd(.7,1.1)}

  for(const p of pulses){ctx.strokeStyle=`rgba(61,232,255,${.28*p.a*L.think})`;ctx.lineWidth=1.2;ctx.beginPath();ctx.arc(cx,cy,p.r,0,6.2832);ctx.stroke()}

  // particles + network
  const n=P.length, LINK=Math.min(170,W*.1);
  for(let i=0;i<n;i++){
    const p=P[i];
    if(!RM){p.x+=p.vx*p.z*60*dt;p.y+=p.vy*p.z*60*dt}
    if(p.x<-20)p.x=W+20;else if(p.x>W+20)p.x=-20;if(p.y<-20)p.y=H+20;else if(p.y>H+20)p.y=-20;

  }
  ctx.lineWidth=.8;

  for(let i=0;i<n;i++){
    const a=P[i];

      const d=Math.hypot(dx,dy);if(d>=LINK)continue;
      let al=(1-d/LINK)*baseA*Math.min(a.z,b.z)*1.4;

    }
  }
  for(let i=0;i<n;i++){
    const p=P[i];let a=(.35+.3*Math.sin(t*.9+p.ph))*p.z;
    let s=p.r*p.z*7;

    ctx.globalAlpha=clamp(a,0,1);ctx.drawImage(p.s,p.dx-s,p.dy-s,s*2,s*2);
  }

  for(const d of D){

  }

}

const NB=46, bars=new Float32Array(NB), tgt=new Float32Array(NB), phs=Array.from({length:NB},()=>rnd(0,6.3));
let lvlSm=0,ctxLvl=0;
function drawWave(t,dt){
  const ctx=wctx,w=wave.width/DPR,h=wave.height/DPR;
  ctx.setTransform(DPR,0,0,DPR,0,0);ctx.clearRect(0,0,w,h);
  const mid=h/2,cx=w/2,gap=56,step=(cx-gap-8)/NB;
  // levels per bar
  let real=false;
  if(analyser&&freqData&&state==='listening'){analyser.getByteFrequencyData(freqData);real=true}
  const s=L.speak,th=L.think,li=L.listen;
  for(let i=0;i<NB;i++){
    const f=i/NB;
    let v=.07+.05*Math.sin(t*.9+phs[i]+i*.35);             // idle calm
    if(li>.02){
      let a;
      if(real){const bin=Math.floor(Math.pow(f,1.3)*freqData.length*.7);a=freqData[bin]/255;a=Math.pow(a,1.2)*1.3}
      else a=(.5+.5*Math.sin(t*5.3+phs[i]*2+i*.5))*(.35+.5*Math.abs(Math.sin(t*1.7)))*(1-f*.5);
      v=lerp(v,.12+a*.85,li);
    }
    if(th>.02){const q=(f*4.5-t*1.6);v=lerp(v,.1+.4*Math.max(0,Math.sin(q*3.14))**2*(1-f*.4),th)}
    if(s>.02){
      const env=.2+.8*(mouthOpen*1.1+kick*.3),a=(.5+.5*Math.sin(t*9+phs[i]*3+i*.7))*env*(1-f*.55);
      v=lerp(v,.1+a*.95,s);
    }
    tgt[i]=v;bars[i]=sm(bars[i],v,12,dt);
  }
  const act=Math.max(li,th,s);
  ctx.lineCap='round';
  // flowing line
  const lg=ctx.createLinearGradient(0,0,w,0);
  lg.addColorStop(0,'rgba(61,232,255,0)');lg.addColorStop(.5,`rgba(61,232,255,${.5+.3*act})`);lg.addColorStop(1,'rgba(61,232,255,0)');
  ctx.strokeStyle=lg;ctx.lineWidth=1;ctx.beginPath();
  const amp=3+act*9;
  for(let x=0;x<=w;x+=4){const d=Math.abs(x-cx);if(d<gap-6&&false)continue;const e=Math.max(0,1-d/(cx));
    const y=mid+Math.sin(x*.025-t*(1.6+act*2))*amp*e+Math.sin(x*.011+t*.8)*amp*.5*e;x?ctx.lineTo(x,y):ctx.moveTo(x,y)}
  ctx.stroke();

  for(let side=-1;side<=1;side+=2){
    for(let i=0;i<NB;i++){
      const x=cx+side*(gap+i*step),taper=Math.pow(1-i/NB,.8),hh=Math.max(1.5,bars[i]*(h*.42)*taper*2+1.5);
      const a=(.25+.65*taper)*(.55+.45*act);
      ctx.strokeStyle=`rgba(61,232,255,${a*.18})`;ctx.lineWidth=4;ctx.beginPath();ctx.moveTo(x,mid-hh/2);ctx.lineTo(x,mid+hh/2);ctx.stroke();
      ctx.strokeStyle=i%9===4?`rgba(120,170,255,${a})`:`rgba(110,235,255,${a})`;ctx.lineWidth=1.4;ctx.beginPath();ctx.moveTo(x,mid-hh/2);ctx.lineTo(x,mid+hh/2);ctx.stroke();
    }
  }
}

const dialogueEl = $('voice-dialogue');

function clearSpeechQueue() {

function queueSpeechChunk(chunk) {
  if (!chunk || !chunk.trim()) return;
  speechQueue.push(chunk.trim());
  if (!isQueueActive) {
    playNextQueuedSpeech();
  }
}

function playNextQueuedSpeech() {
  if (speechQueue.length === 0) {
    isQueueActive = false;
    if (state === 'speaking') setState('idle');

async function sendPrompt(userText) {
  if (!userText || !userText.trim()) return;
  const q = userText.trim();
  clearSpeechQueue();
  clearTimeout(silenceTimer);
  if (dialogueEl) dialogueEl.textContent = 'You: "' + q + '"';
  setState('thinking');
  try {
    let unvoicedBuffer = '';
    let hasVoicedAny = false;

    const replyText = await aiPipeline.generateReply(q, (streamChunk) => {
      if (dialogueEl) dialogueEl.textContent = 'AIRA: "' + streamChunk + '..."';

      // Live Sub-Second Streaming Speech: Voice sentence 1 immediately when complete!
      unvoicedBuffer = streamChunk;
      if (!hasVoicedAny) {
        let pIdx = -1;
        for (const p of ['.', '!', '?']) {
          const idx = unvoicedBuffer.indexOf(p);
          if (idx !== -1 && (pIdx === -1 || idx < pIdx)) {
            pIdx = idx;
          }
        }
        if (pIdx !== -1 && unvoicedBuffer.slice(0, pIdx + 1).trim().split(/\s+/).length >= 2) {
          hasVoicedAny = true;
          queueSpeechChunk(unvoicedBuffer.slice(0, pIdx + 1).trim());
        }
      }
    });

    if (dialogueEl) dialogueEl.textContent = 'AIRA: "' + replyText + '"';

    if (!hasVoicedAny) {
      queueSpeechChunk(replyText);
    } else {
      let pIdx = -1;
      for (const p of ['.', '!', '?']) {
        const idx = replyText.indexOf(p);
        if (idx !== -1 && (pIdx === -1 || idx < pIdx)) {
          pIdx = idx;
        }
      }
      if (pIdx !== -1) {
        const remaining = replyText.slice(pIdx + 1).trim();
        if (remaining) queueSpeechChunk(remaining);
      }
    }
  } catch (err) {
    console.error('Error generating reply:', err);
    setState('idle');
    if (dialogueEl) dialogueEl.textContent = 'Error: ' + (err.message || err);
  }
}

function speakTextWithVisemes(rawText, onDone) {
  let doneCalled = false;
  const finish = () => {
    if (!doneCalled) {
      doneCalled = true;
      if (onDone) onDone();
    }
  };

  if (!rawText) {
    finish();
    return;
  }
  const text = rawText
    .replace(/[*_#`~\[\]]/g, '')
    .replace(/^\s*[-•\d.]+\s+/gm, '')
    .replace(/\s+/g, ' ')
    .trim();
  if (!text) {
    finish();
    return;
  }
  stopSpeech();
  const rate = 1.15;
  const tl = buildTL(text, rate);
  sp = { mode: 'tl', text, tl, t0: tt + 0.1, idx: 0, lastB: -9 };
  setState('speaking');
  try {
    if (window.speechSynthesis && window.SpeechSynthesisUtterance) {
      clearTimeout(spkTimer);
      try {
        window.speechSynthesis.cancel();
        if (window.speechSynthesis.paused) window.speechSynthesis.resume();
      } catch(e){}
      spkTimer = setTimeout(() => {
        if (!sp || sp.text !== text) {
          finish();
          return;
        }
        utt = new SpeechSynthesisUtterance(text);
        utt.rate = rate;
        utt.pitch = 1.02;

        const voices = window.speechSynthesis.getVoices();
        const v = voices.find(vo => vo.lang.startsWith('en') && (
          vo.name.includes('Natural') || 
          vo.name.includes('Neural') || 
          vo.name.includes('Aria') || 
          vo.name.includes('Jenny') || 
          vo.name.includes('Google') || 
          vo.name.includes('Samantha') || 
          vo.name.includes('Zira')
        ));
        if (v) utt.voice = v;

        utt.onstart = () => { if (sp && sp.text === text) sp.t0 = tt; };
        utt.onboundary = e => {
          if (!sp || sp.text !== text || e.name === 'sentence') return;
          const ev = sp.tl.ev.find(q => q.ci >= e.charIndex);
          if (ev) {
            const want = tt - ev.t;
            sp.t0 = sp.t0 * 0.3 + want * 0.7;
            sp.lastB = tt;
            kick = 1;
          }
        };
        utt.onend = () => {
          if (sp && sp.text === text) {
            sp.ended = true;
            if (state === 'speaking') setState('idle');
          }
          finish();
        };
        utt.onerror = () => {
          if (state === 'speaking') setState('idle');
          finish();
        };
        try {
          if (window.speechSynthesis.paused) window.speechSynthesis.resume();
          window.speechSynthesis.speak(utt);
        } catch(e) {
          if (state === 'speaking') setState('idle');
          finish();
        }

        // Hard safety watchdog: guarantees avatar never gets stuck in 'speaking'
        const maxDurationMs = Math.max(2500, (sp.tl.total + 1.2) * 1000);
        setTimeout(() => {
          if (state === 'speaking' && sp && sp.text === text) {
            sp.ended = true;
            setState('idle');
          }
          finish();
        }, maxDurationMs);
      }, 60);
    } else {
      finish();
    }
  } catch (e) {
    if (state === 'speaking') setState('idle');
    finish();
  }
}

function encodeWAV(samples, sampleRate) {
  const buffer = new ArrayBuffer(44 + samples.length * 2);
  const view = new DataView(buffer);
  function writeString(v, offset, str) {
    for (let i = 0; i < str.length; i++) v.setUint8(offset + i, str.charCodeAt(i));
  }
  writeString(view, 0, 'RIFF');
  view.setUint32(4, 36 + samples.length * 2, true);
  writeString(view, 8, 'WAVE');
  writeString(view, 12, 'fmt ');
  view.setUint32(16, 16, true);
  view.setUint16(20, 1, true); // PCM format
  view.setUint16(22, 1, true); // Mono
  view.setUint32(24, sampleRate, true);
  view.setUint32(28, sampleRate * 2, true);
  view.setUint16(32, 2, true);
  view.setUint16(34, 16, true);
  writeString(view, 36, 'data');
  view.setUint32(40, samples.length * 2, true);
  let offset = 44;
  for (let i = 0; i < samples.length; i++, offset += 2) {
    const s = Math.max(-1, Math.min(1, samples[i]));
    view.setInt16(offset, s < 0 ? s * 0x8000 : s * 0x7FFF, true);
  }
  return new Blob([view], { type: 'audio/wav' });
}

function downsampleBuffer(buffer, inputSampleRate, outputSampleRate = 16000) {
  if (outputSampleRate >= inputSampleRate) return buffer;
  const ratio = inputSampleRate / outputSampleRate;
  const newLength = Math.round(buffer.length / ratio);
  const result = new Float32Array(newLength);
  let offsetResult = 0;
  let offsetBuffer = 0;
  while (offsetResult < result.length) {
    const nextOffsetBuffer = Math.round((offsetResult + 1) * ratio);
    let accum = 0, count = 0;
    for (let i = offsetBuffer; i < nextOffsetBuffer && i < buffer.length; i++) {
      accum += buffer[i];
      count++;
    }
    result[offsetResult] = count > 0 ? (accum / count) : buffer[offsetBuffer];
    offsetResult++;
    offsetBuffer = nextOffsetBuffer;
  }
  return result;
}

/* ---------- Hugging Face & Free AI Pipeline (STT -> LLM -> TTS -> LipSync) ---------- */
class AIVoicePipeline {
  constructor() {
    this.token = localStorage.getItem('AIRA_HF_TOKEN') || '';
    this.sttModel = localStorage.getItem('AIRA_STT_MODEL') || 'openai/whisper-large-v3-turbo';
    this.llmModel = localStorage.getItem('AIRA_LLM_MODEL') || 'meta-llama/Llama-3.1-8B-Instruct';
    this.ttsModel = localStorage.getItem('AIRA_TTS_MODEL') || 'facebook/mms-tts-eng';
    this.audioChunks = [];
    this.mediaRecorder = null;
    this.recStream = null;
    this.interimText = '';
    this.isRecording = false;
    this.conversation = [];
    this.sr = null;
  }

  saveConfig(token, stt, llm, tts) {
    this.token = (token || '').trim();
    this.sttModel = stt || this.sttModel;
    this.llmModel = llm || this.llmModel;
    this.ttsModel = tts || this.ttsModel;
    localStorage.setItem('AIRA_HF_TOKEN', this.token);
    localStorage.setItem('AIRA_STT_MODEL', this.sttModel);
    localStorage.setItem('AIRA_LLM_MODEL', this.llmModel);
    localStorage.setItem('AIRA_TTS_MODEL', this.ttsModel);
  }

  async startRecording(onInterim, onError, onAudioActivity) {
    this.pcmChunks = [];
    this.audioChunks = [];
    this.interimText = '';
    this.maxRms = 0;
    this.isRecording = true;

    // 1. Microphone Audio Stream for visualizer & raw PCM capture
    try {
      const stream = await navigator.mediaDevices.getUserMedia({
        audio: {
          echoCancellation: true,
          noiseSuppression: true,
          autoGainControl: true
        }
      });
      this.recStream = stream;
      attachAudioStream(stream);

      // 1a. Native MediaRecorder (most robust across all Chromium versions)
      try {
        const mime = MediaRecorder.isTypeSupported('audio/webm;codecs=opus') ? 'audio/webm;codecs=opus' : '';
        const rec = mime ? new MediaRecorder(stream, { mimeType: mime }) : new MediaRecorder(stream);
        this.mediaRecorder = rec;
        rec.ondataavailable = e => {
          if (e.data && e.data.size > 0) this.audioChunks.push(e.data);
        };
        rec.start(100);
      } catch (e) {
        console.warn('MediaRecorder notice:', e);
      }

      // 1b. Web Audio recording node to record raw 16kHz PCM WAV & monitor live volume
      try {
        const AC = window.AudioContext || window.webkitAudioContext;
        const recCtx = new AC();
        if (recCtx.state === 'suspended') {
          await recCtx.resume();
        }
        this.recAudioCtx = recCtx;
        this.recSampleRate = recCtx.sampleRate;
        const src = recCtx.createMediaStreamSource(stream);
        const spNode = recCtx.createScriptProcessor(4096, 1, 1);
        this.recProcessor = spNode;
        const zeroGain = recCtx.createGain();
        zeroGain.gain.value = 0;

        spNode.onaudioprocess = (e) => {
          if (!this.isRecording) return;
          const input = e.inputBuffer.getChannelData(0);
          this.pcmChunks.push(new Float32Array(input));

          // Calculate RMS volume level to confirm live microphone audio
          let sum = 0;
          for (let i = 0; i < input.length; i++) sum += input[i] * input[i];
          const rms = Math.sqrt(sum / input.length);
          if (rms > this.maxRms) this.maxRms = rms;
          const pct = Math.min(100, Math.round(rms * 450));
          if (onAudioActivity) {
            onAudioActivity(rms, pct);
          }
        };
        src.connect(spNode);
        spNode.connect(zeroGain);
        zeroGain.connect(recCtx.destination);
      } catch (e) {
        console.warn('Web Audio PCM capture notice:', e);
      }
    } catch (e) {
      console.warn('Microphone capture error:', e);
      if (onError) onError('Microphone access denied: ' + (e.message || e));
      return;
    }

    // 2. Browser Real-Time Speech Recognition (Web Speech API)
    const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (SR) {
      try {
        const sr = new SR();
        sr.continuous = true;
        sr.interimResults = true;
        sr.lang = navigator.language || 'en-US';
        sr.maxAlternatives = 1;

        sr.onspeechstart = () => {
          if (dialogueEl && state === 'listening' && !this.interimText) {
            dialogueEl.textContent = 'Listening... (I hear you 🎙️)';
          }
        };

        sr.onresult = (e) => {
          let full = '';
          for (let i = 0; i < e.results.length; ++i) {
            full += e.results[i][0].transcript;
          }
          if (full.trim()) {
            this.interimText = full.trim();
            if (onInterim) onInterim(this.interimText);
          }
        };

        sr.onerror = (e) => {
          console.warn('SpeechRecognition notice:', e.error);
        };

        sr.onend = () => {
          if (this.isRecording && !this.interimText) {
            try { sr.start(); } catch (err) {}
          }
        };

        sr.start();
        this.sr = sr;
      } catch (e) {
        console.warn('Could not start SpeechRecognition:', e);
      }
    }
  }

  async stopRecording() {
    this.isRecording = false;
    if (this.sr) {
      try { this.sr.onend = null; this.sr.stop(); } catch (e) {}
      this.sr = null;
    }
    if (this.mediaRecorder && this.mediaRecorder.state !== 'inactive') {
      await new Promise(resolve => {
        this.mediaRecorder.onstop = resolve;
        try { this.mediaRecorder.stop(); } catch(e) { resolve(); }
        setTimeout(resolve, 300);
      });
    }
    if (this.recProcessor) {
      try { this.recProcessor.disconnect(); } catch(e){}
      this.recProcessor = null;
    }
    if (this.recAudioCtx && this.recAudioCtx.state !== 'closed') {
      try { this.recAudioCtx.close(); } catch(e){}
      this.recAudioCtx = null;
    }
    if (this.recStream) {
      this.recStream.getTracks().forEach(t => t.stop());
      this.recStream = null;
    }

    let finalBlob = null;
    if (this.pcmChunks && this.pcmChunks.length > 0) {
      let totalLen = 0;
      for (let i = 0; i < this.pcmChunks.length; i++) totalLen += this.pcmChunks[i].length;
      const flat = new Float32Array(totalLen);
      let offset = 0;
      for (let i = 0; i < this.pcmChunks.length; i++) {
        flat.set(this.pcmChunks[i], offset);
        offset += this.pcmChunks[i].length;
      }
      const downsampled = downsampleBuffer(flat, this.recSampleRate || 48000, 16000);
      finalBlob = encodeWAV(downsampled, 16000);
    } else if (this.audioChunks && this.audioChunks.length > 0) {
      finalBlob = new Blob(this.audioChunks, { type: 'audio/webm' });
    }
    this.pcmChunks = [];
    this.audioChunks = [];
    return { blob: finalBlob, text: this.interimText };
  }

  async transcribe(blob, fallbackText) {
    this.lastSttError = null;
    // 1. Primary: Send clean recorded audio directly to Whisper AI STT
    if (blob && blob.size > 200) {
      try {
        const fd = new FormData();
        const ext = (blob.type && blob.type.includes('wav')) ? 'speech.wav' : 'speech.webm';
        fd.append('audio', blob, ext);
        const sttUrl = (window.location.protocol === 'file:') ? 'http://127.0.0.1:8000/api/stt' : '/api/stt';
        console.log(`[AIRA Whisper STT] Uploading audio (${blob.size} bytes, ${blob.type}) to ${sttUrl}...`);
        const res = await fetch(sttUrl, {
          method: 'POST',
          body: fd,
          signal: typeof AbortSignal.timeout === 'function' ? AbortSignal.timeout(12000) : undefined
        });
        if (res.ok) {
          const data = await res.json();
          if (data && data.text && data.text.trim()) {
            console.log('[AIRA Whisper STT] Transcribed successfully:', data.text.trim());
            return data.text.trim();
          } else {
            console.log('[AIRA Whisper STT] No speech detected in audio clip');
          }
        } else {
          this.lastSttError = `Server returned HTTP ${res.status}`;
          console.warn('[AIRA Whisper STT] HTTP error:', res.status);
        }
      } catch (e) {
        this.lastSttError = e.message || String(e);
        console.warn('Whisper STT error, falling back to Web Speech:', e);
      }
    }

    // 2. Secondary Fallback: Browser Web Speech API
    const userSpoken = (fallbackText || '').trim();
    if (userSpoken) {
      return userSpoken;
    }

    return '';
  }

  async generateReply(promptText, onStream) {
    if (!promptText || !promptText.trim()) {
      return "I didn't hear anything. Please try speaking again.";
    }
    this.conversation.push({ role: 'user', content: promptText.trim() });
    if (this.conversation.length > 8) this.conversation = this.conversation.slice(-8);

    const systemPrompt = "You are AIRA, a super-smart, friendly, and helpful voice assistant. Provide clear, accurate, and direct answers in 1 to 2 complete sentences. Always finish your thoughts cleanly with proper punctuation.";
    const messages = [
      { role: 'system', content: systemPrompt },
      ...this.conversation
    ];

    const cleanReply = (raw) => {
      let r = (raw || '').trim();
      for (const prefix of ['assistant\n', 'assistant:\n', 'assistant:', 'AIRA:\n', 'AIRA:']) {
        if (r.toLowerCase().startsWith(prefix.toLowerCase())) r = r.slice(prefix.length).trim();
      }
      const pDot = r.lastIndexOf('.');
      const pExcl = r.lastIndexOf('!');
      const pQues = r.lastIndexOf('?');
      const maxPunct = Math.max(pDot, pExcl, pQues);

      const res = await fetch(serverUrl, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },

      });

          streamBuf = lines.pop();

            if (!trimmed.startsWith('data:')) continue;

            if (dataStr === '[DONE]') {
              streamDone = true;
              break;

              const parsed = JSON.parse(dataStr);
              if (parsed.content) {
                fullReply += parsed.content;
                if (onStream && fullReply.trim()) onStream(fullReply.trim());

        if (finalized) {

          return finalized;
        }

          model: 'llama3.2:1b',
          messages,
          stream: false,
          keep_alive: -1,
          options: { temperature: 0.5, num_predict: 75, num_thread: 4, num_ctx: 256 }

          method: 'POST',
          headers: {
            'Authorization': 'Bearer ' + this.token,
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({
            model: this.llmModel,
            messages,

            temperature: 0.7
          }),

      ]);
    }
    if (qLower.includes('favorite color') || qLower.includes('favourite colour')) {
      return "Cosmic electric blue, without a doubt—it's sleek and full of energy!";
    }
    if (qLower.includes('favorite food')) {
      return "Freshly baked pizza with crisp crust and gooey mozzarella, hands down!";
    }
    if (qLower.includes('weather') || qLower.includes('rain') || qLower.includes('sunny')) {
      return "I don't have eyes outside right now, but tell me your city and I can help look up your forecast!";
    }
    if (qLower.includes('thank') || qLower.includes('thanks')) {
      return pickDifferent([
        "You're very welcome! Always here for you.",
        "Anytime at all! Glad I could help.",
        "No problem at all—that's what friends are for!"
      ]);
    }
    if (qLower.includes('bye') || qLower.includes('goodbye') || qLower.includes('see you')) {

    }

    // Common factual questions
    if (qLower.includes('prime minister of india') || qLower.includes('pm of india')) {
      return "Narendra Modi is the Prime Minister of India.";
    }
    if (qLower.includes('president of the us') || qLower.includes('president of the united states') || qLower.includes('us president')) {
      return "Joe Biden is the President of the United States.";
    }
    if (qLower.includes('capital of france')) {
      return "The capital of France is Paris.";
    }
    if (qLower.includes('capital of india')) {
      return "The capital of India is New Delhi.";
    }
    if (qLower.includes('grass green') || qLower.includes('grass is green')) {
      return "Grass is green because of chlorophyll, a pigment that plants use to absorb sunlight for photosynthesis.";
    }
    if (qLower.includes('sky blue') || qLower.includes('sky is blue')) {
      return "The sky looks blue because the atmosphere scatters shorter blue wavelengths of sunlight more than other colors.";
    }
    if (qLower.includes('can you hear me') || qLower.includes('hear me') || qLower.includes('are you there')) {

  async synthesize(text) {

        });

      } catch (e) {

      }

let breathPh=rnd(0,6);
function stepFace(t,dt){
  const m=MOT*.5;
  L.listen=sm(L.listen,state==='listening'?1:0,3,dt);L.think=sm(L.think,state==='thinking'?1:0,3,dt);L.speak=sm(L.speak,state==='speaking'?1:0,3,dt);

  const spk=S.speakAmt.up(state==='speaking'&&t>prepUntil?1:0,4,dt);
  const prep=S.prep.up(state==='speaking'&&t<prepUntil?1:0,9,dt);
  if(emo&&t>emoUntil)emo=null;
  const eh=S.emH.up(emo==='h'?1:0,3.2,dt),es=S.emS.up(emo==='s'?1:0,3.2,dt),ec=S.emC.up(emo==='c'?1:0,3.2,dt);
  if(t>idleSmile.next&&state!=='thinking'&&!RM){idleSmile.tg=rnd(.2,.5);idleSmile.asym=rnd(.55,1);idleSmile.until=t+rnd(2.2,4.2);idleSmile.next=idleSmile.until+rnd(5,12)}
  if(t>idleSmile.until)idleSmile.tg=0;
  updateGaze(t,dt);
  const gx=S.gx.up(gz.tx+gz.micro.x,gz.w,dt,1),gy=S.gy.up(gz.ty+gz.micro.y,gz.w,dt,1);
  S.hgx.up(gx,6.5,dt);S.hgy.up(gy,6.5,dt);
  updateBlink(t);const[bl,br]=blinkVals(t);
  const bL=S.blinkL.up(bl,32,dt),bR=S.blinkR.up(br,32,dt);
  const[ta,to,ts=0]=speechTargets(t);
  const spkNow=state==='speaking';
  const aw=S.ah.up(ta,spkNow?18:6,dt,1.05),ow=S.oo.up(to,spkNow?18:6,dt,1.05);
  const sw=S.spread.up(ts,spkNow?18:6,dt,1.05);
  const stress=Math.max(0,1-(t-spStressT)/.45);const bp=S.browPulse.up(spkNow&&stress>0?stress*.5:0,9,dt);
  kick*=Math.exp(-6*dt);mouthOpen=Math.min(1,aw*1.1+ow*.4);
  const nb=nT[0](t*1.3);
  let curB=0,curE=0,focB=0,focE=0,focM=0;
  curB+=S.listen.x*.28+prep*.25+bp*.35+ec*.85;curE+=S.listen.x*.12+ec*.65;
  focE+=S.think.x*.2+es*.5;focB+=S.think.x*.18+es*.75;focM+=es*.2;
  const smileT=clamp(eh*.8+prep*.3+(state==='speaking'?.08:0),0,1);
  const smSm=S.smileM.up(smileT*(1-.8*es),2.6,dt);
  const smC=smSm*.9+.05*aw,smE=smSm*.6;
  const cB=S.curB.up(curB,3.2,dt),cE=S.curE.up(curE,3.2,dt),fB=S.focB.up(focB,3.2,dt),fE=S.focE.up(focE,3.2,dt);
  const sC=S.smileC.up(smC,3,dt),sE=S.smileE.up(smE,3,dt);
  const A=nAmp(t)*.3+.7,dx=S.hgx.x,dy=S.hgy.x;
  breathPh+=dt*(2*Math.PI/4)*(1+.06*nT[8](t*.2));const br_=(1-Math.cos(breathPh))/2;
  const sgn=gz.tx<0?-1:1;
  const thinkTilt=S.think.x*.9*sgn+S.listen.x*.5+ec*.7*sgn;
  const tilt=S.tilt.up((nT[0](t)*.55+nT[5](t*.6)*.25)*m*A+(thinkTilt+dx*.4)*m,5,dt);
  const hx=(nT[1](t)*3.6+dx*6.5)*m*A+(spkNow?nT[6](t*1.7)*1.2*m:0);
  const hy=(nT[2](t)*2.6+dy*3.5)*m*A-br_*.9*m+bp*3*m+aw*1.6*m;
  const sc=(nT[3](t)*.003*A+br_*.0006)*m+S.listen.x*.003*m;
  const yaw=S.yaw.up((nT[7](t*.8)*.9+dx*1.2)*m*A,4,dt);
  const hl=hairSpL.up(nT[9](t*.7)*1.2*m,3.4,dt),hr=hairSpR.up(nT[10](t*.6)*1.2*m,2.8,dt);

  const bAsy=1+.15*nT[4](t*.8)*m;

  gl.uniform1f(U('uSh'),-br_*1.4*m);
  gl.uniform3f(U('uHead'),hx*.55,hy*.55,tilt*Math.PI/180);
  gl.uniform2f(U('uHS'),sc,yaw*.6);

}

/* ---------- Settings Modal Handlers ---------- */
const settingsModal = $('settings-modal');
const settingsBtn = $('settings-btn');
const settingsClose = $('settings-close');
const hfTokenInput = $('hf-token-input');
const hfTokenToggle = $('hf-token-toggle');
const hfSttSelect = $('hf-stt-select');
const hfLlmSelect = $('hf-llm-select');
const hfTtsSelect = $('hf-tts-select');
const hfStatusBox = $('hf-status-box');
const hfStatusText = $('hf-status-text');
const hfDot = $('hf-dot');
const cfgSaveBtn = $('cfg-save-btn');
const cfgTestBtn = $('cfg-test-btn');

function updateStatusUI() {
  const hasToken = Boolean(aiPipeline.token);
  if (hfDot) hfDot.classList.toggle('off', !hasToken);
  if (hfStatusText) {
    hfStatusText.textContent = hasToken ? 'Hugging Face API: Connected (' + aiPipeline.llmModel.split('/')[1] + ')' : 'Local / Web Speech Fallback Active (Enter HF token above for full neural pipeline)';
  }
}

function openSettings() {
  if (hfTokenInput) hfTokenInput.value = aiPipeline.token || '';
  if (hfSttSelect) hfSttSelect.value = aiPipeline.sttModel;
  if (hfLlmSelect) hfLlmSelect.value = aiPipeline.llmModel;
  if (hfTtsSelect) hfTtsSelect.value = aiPipeline.ttsModel;
  updateStatusUI();
  if (settingsModal) settingsModal.classList.add('open');
}

function closeSettings() {
  if (settingsModal) settingsModal.classList.remove('open');
}

if (settingsBtn) settingsBtn.addEventListener('click', openSettings);
if (settingsClose) settingsClose.addEventListener('click', closeSettings);
if (settingsModal) {
  settingsModal.addEventListener('click', e => { if (e.target === settingsModal) closeSettings(); });
}

if (hfTokenToggle && hfTokenInput) {
  hfTokenToggle.addEventListener('click', () => {
    const isPass = hfTokenInput.type === 'password';
    hfTokenInput.type = isPass ? 'text' : 'password';
    hfTokenToggle.textContent = isPass ? 'HIDE' : 'SHOW';
  });
}

if (cfgSaveBtn) {
  cfgSaveBtn.addEventListener('click', () => {
    aiPipeline.saveConfig(
      hfTokenInput.value,
      hfSttSelect.value,
      hfLlmSelect.value,
      hfTtsSelect.value
    );
    updateStatusUI();
    closeSettings();
  });
}

if (cfgTestBtn) {
  cfgTestBtn.addEventListener('click', async () => {
    closeSettings();
    setState('thinking');
    if (dialogueEl) dialogueEl.textContent = 'Testing Hugging Face AI pipeline...';
    const reply = await aiPipeline.generateReply('Give a quick one-sentence status report.');
    if (dialogueEl) dialogueEl.textContent = 'AIRA: "' + reply + '"';
    const audio = await aiPipeline.synthesize(reply);
    await speakAIRAReply(reply, audio);
  });
}

window.AIRA={
  setState,
  emote,
  speak:audio=>lipSync.speak(audio),
  attachStream:stream=>lipSync.attachStream(stream),
  detachStream:()=>lipSync.detachStream(),
  stopSpeaking:()=>lipSync.stopSpeaking(),
  get lipSync(){return lipSync;},
  get aiPipeline(){return aiPipeline;},
  openSettings,
  advance:s=>{for(let i=0;i<s*60;i++){tt+=1/60;step(1/60)}},
  get t(){return tt},
  get state(){return state}
};
window.TalkingAvatarLipSync=TalkingAvatarLipSync;

// Protocol Checker: In Google Chrome, Web Speech recognition is blocked on file:// URLs.
// Automatically redirect to http://localhost:8000 if server is running, or show notice.
if (window.location.protocol === 'file:') {
  fetch('http://127.0.0.1:8000/api/status', {
    signal: typeof AbortSignal.timeout === 'function' ? AbortSignal.timeout(1000) : undefined
  }).then(r => r.json()).then(() => {
    window.location.href = 'http://localhost:8000';
  }).catch(() => {
    const banner = document.createElement('div');
    banner.style.cssText = 'position:fixed;top:0;left:0;right:0;background:#0d233a;border-bottom:2px solid #00d2ff;color:#e0f7ff;padding:10px 16px;text-align:center;font-size:13px;z-index:999999;box-shadow:0 4px 15px rgba(0,0,0,0.5);display:flex;align-items:center;justify-content:center;gap:12px;';
    banner.innerHTML = '<span>🎙️ <b>Voice Notice:</b> Chrome disables mic speech recognition on local files. Launch via <code>start_aira.bat</code> or open <a href="http://localhost:8000" style="color:#00d2ff;text-decoration:underline;">http://localhost:8000</a></span>';
    document.body.prepend(banner);
  });
}

function boot(){
  layout();addEventListener('resize',layout);
  lipSync.loadModel().catch(e=>console.warn(e));
  loadAll().then(()=>{layout();glReady=true;glc.style.opacity=1;document.body.classList.add('ready');window.__ready=true});
  requestAnimationFrame(frame);
}
boot();

})();
